name: Expand verified 2.0.5 source
on:
  push:
    branches: ['release/v2.0.5-complete']
    paths: ['.github/workflows/expand-source205.yml']
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,base64,lzma,json
          digest=lambda b:hashlib.sha256(b).hexdigest()
          parts=[pathlib.Path(f'.delivery205/source-{n:02}.b64').read_text() for n in range(8)]
          raw=base64.b64decode(''.join(''.join(parts).split()),validate=True)
          assert digest(raw)=='e4f1562367dbd74a3a373611c729ed45eed05461857256554c4ec80d35fab403','Source transfer checksum mismatch'
          changes=json.loads(lzma.decompress(raw))
          results=[]
          for name,change in changes.items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0]!='.git'
              if path.exists() and digest(path.read_bytes())==change['result']: continue
              if 'new' in change: text=change['new']
              else:
                  text=path.read_text()
                  assert digest(text.encode())==change['sha'],name+' baseline mismatch'
                  for start,end,replacement in reversed(change['edits']): text=text[:start]+replacement+text[end:]
              assert digest(text.encode())==change['result'],name+' result mismatch'
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
              results.append(name)
          print('Expanded',len(results),'verified files:',*results,sep='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components hooks lib mobile package.json package-lock.json scripts
          git diff --cached --quiet || git commit -m 'feat: complete 2.0.5 settings chat memory calendar weather and motion refinement'
          git push origin HEAD:release/v2.0.5-complete
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test scripts/checks/*.test.mjs
