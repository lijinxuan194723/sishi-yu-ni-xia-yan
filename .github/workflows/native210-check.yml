name: Native migration checkpoint 210
on:
  push:
    branches: ['feature/v2.0.10-native-migration']
    paths: ['.github/workflows/native210-check.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile native data and domain modules
        working-directory: native
        run: gradle --no-daemon --max-workers=2 :core:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native210-core-reports
          path: |
            native/core/build/reports
            native/core/build/test-results
            native/core/schemas
          retention-days: 7
