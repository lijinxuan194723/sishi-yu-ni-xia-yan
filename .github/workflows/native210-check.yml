name: Native migration checkpoint 210
on:
  push:
    branches: ['feature/v2.0.10-native-migration']
    paths:
      - '.github/workflows/native210-check.yml'
      - 'native/core/**'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and test native data and domain modules only
        working-directory: native
        run: gradle --no-daemon --console=plain --max-workers=2 :core:testDebugUnitTest
      - name: Summarize actual test results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET, json, os
          reports = list(pathlib.Path('native/core/build/test-results').rglob('TEST-*.xml'))
          totals = {'tests':0,'failures':0,'errors':0,'skipped':0}
          for path in reports:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key,0))
          totals['scope'] = 'Native core only; application UI not yet migrated or validated'
          totals['commit'] = os.environ['GITHUB_SHA']
          print(json.dumps(totals, ensure_ascii=False))
          pathlib.Path('native/core/verification').mkdir(exist_ok=True)
          pathlib.Path('native/core/verification/summary.json').write_text(json.dumps(totals,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native210-core-reports
          path: |
            native/core/build/reports
            native/core/build/test-results
            native/core/schemas
            native/core/verification
          retention-days: 7
