name: Verify and build 2.0.5
on:
  push:
    branches: ['release/v2.0.5-polish']
    paths: ['.ci205-run', '.github/workflows/polish205.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: polish205
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package exact source and development dependencies
        if: hashFiles('.ci205-run') == ''
        run: |
          set -euo pipefail
          mkdir -p work/offline205
          git archive --format=tar HEAD | gzip > work/offline205/source.tar.gz
          tar czf work/offline205/node_modules.tar.gz node_modules
          printf '%s\n' "$GITHUB_SHA" > work/offline205/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: hashFiles('.ci205-run') == ''
        with:
          name: offline205
          path: work/offline205/
          compression-level: 0
          retention-days: 2
      - name: Type check and regression tests
        if: hashFiles('.ci205-run') != ''
        run: |
          mkdir -p work/check205
          npx tsc --noEmit > work/check205/types.txt 2>&1
          node --experimental-strip-types --test scripts/checks/polish205.test.mjs | tee work/check205/logic.tap
      - name: Mobile bundle
        if: hashFiles('.ci205-run') != ''
        run: npx vite build --config mobile/vite.config.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check205
          path: work/check205/
          if-no-files-found: ignore
