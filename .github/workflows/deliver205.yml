name: Verify isolated 2.0.5 source
on:
  push:
    branches: ['release/v2.0.5-complete']
    paths-ignore: ['docs/**', 'CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review205-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types and full logic regression
        run: |
          set -euo pipefail
          mkdir -p work/check205
          npx tsc --noEmit 2>&1 | tee work/check205/types.txt
          node --experimental-strip-types --test scripts/checks/*.test.mjs 2>&1 | tee work/check205/logic.tap
      - name: Mobile bundle and runtime harness
        run: |
          npx vite build --config mobile/vite.config.mts
          node scripts/checks/build-harness205.mjs
      - name: Browser tools
        run: |
          python3 -m pip install playwright==1.57.0 pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Runtime verification
        run: |
          set -o pipefail
          python3 scripts/checks/browser205.py 2>&1 | tee work/check205/browser.txt
      - name: Archive exact source
        if: always()
        run: |
          mkdir -p outputs/review205
          git archive --format=zip HEAD > outputs/review205/source205.zip
          git rev-parse HEAD > outputs/review205/source-commit.txt
          cp -R work/check205 outputs/review205/checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-and-verification205
          path: outputs/review205/
          retention-days: 7
          if-no-files-found: error
